[workspace]
resolver = "2"
members = ["core"]

[profile.release]
lto = true
codegen-units = 1
# NOTE: do NOT set strip = true — it removes the UniFFI metadata symbols
# that library-mode bindgen reads from the host library.
# The Android .so files are stripped later by AGP (stripDebugDebugSymbols).
# Also no panic="abort": UniFFI converts panics into foreign exceptions.